name: Inspect EAS build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build id to inspect'
        required: true
        type: string

jobs:
  inspect:
    name: Print EAS build details
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: View EAS build
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "${{ inputs.build_id }}" --json | tee eas-build-view.json
          echo "--- summary ---"
          jq '{id, status, platform, error: (.error // .errorMessage), project: .projectSlug}' eas-build-view.json || true
