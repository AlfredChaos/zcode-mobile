name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
        default: 'ZCode Mobile'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-android
  cancel-in-progress: true

jobs:
  build_and_release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install --no-save eas-cli

      - name: Build APK via EAS
        run: eas build --platform android --profile release-android --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build to start
        id: wait_start
        run: sleep 30

      - name: Fetch latest build status
        id: fetch_status
        run: |
          BUILD_ID=$(eas build:list --platform android --status finished --json --limit 1 --non-interactive | jq -r '.[0].id // empty')
          if [ -z "$BUILD_ID" ]; then
            echo "No finished Android build found in EAS yet."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: eas build:view --platform android --json --non-interactive | jq -r '.artifacts.applicationArchive.url' | xargs -I {} curl -L -s -o app-release.apk "{}"

      - name: Verify APK
        run: |
          ls -la app-release.apk
          file app-release.apk

      - name: Compute SHA256
        run: sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            app-release.apk
            app-release.apk.sha256