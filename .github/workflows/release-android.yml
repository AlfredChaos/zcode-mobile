name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
        default: 'ZCode Mobile'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-android
  cancel-in-progress: true

jobs:
  build_and_release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build APK via EAS
        id: eas_build
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform android \
            --profile release-android \
            --non-interactive \
            --wait \
            --output app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify APK
        run: |
          ls -la app-release.apk
          file app-release.apk

      - name: Compute SHA256
        run: sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            app-release.apk
            app-release.apk.sha256